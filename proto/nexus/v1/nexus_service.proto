syntax = "proto3";
package nexus.v1;

service NexusService {
    rpc GetAvailableDatasets(GetAvailableDatasetsRequest) returns (GetAvailableDatasetsResponse);
    // The URL of a node's 3D Tiles tileset JSON, for deck.gl to load. The tileset links to its children's tilesets and
    // to the node's points, so deck.gl descends the octree from there by itself. Checks the node exists first: fails
    // with NOT_FOUND for an unknown node, INVALID_ARGUMENT for a malformed id, UNAVAILABLE when Surge cannot be reached.
    rpc GetNodeDescriptionEndpoint(GetNodeDescriptionEndpointRequest) returns (GetNodeDescriptionEndpointResponse);

    // A stream of snapshots of the points Surge ingested most recently (up to 300,000 each), coloured, plus a clock
    // showing when each was taken. Open it once and keep reading: Nexus sends the latest snapshot straight away, then a
    // new one every interval (one second by default) until the frontend closes the stream. Every frontend gets the
    // same snapshots; one that reads slowly skips to the newest rather than falling behind. While Surge cannot be
    // reached the stream stays open and simply sends nothing new.
    rpc GetLivePoints(GetLivePointsRequest) returns (stream GetLivePointsResponse);

    // The ways points can be coloured: which attributes and palettes are available, and the current choice. Fails with
    // UNAVAILABLE when Surge, which lists the attributes, cannot be reached.
    rpc GetColorModes(GetColorModesRequest) returns (GetColorModesResponse);

    // Chooses how points are coloured; returns the mode now in effect. Fails with INVALID_ARGUMENT for an attribute or
    // palette not listed by GetColorModes, UNAVAILABLE when Surge cannot be reached. The choice is shared by every
    // frontend. It applies to every GetLivePoints from then on, and to every tile fetched from then on; tiles deck.gl
    // has already loaded keep their old colours until it fetches them again.
    rpc SetColorMode(SetColorModeRequest) returns (SetColorModeResponse);
}

message GetAvailableDatasetsRequest {

}

message GetAvailableDatasetsResponse {
    repeated DatasetDescriptor dataset_descriptors = 1;
}

message DatasetDescriptor {
    string dataset_id = 1;
    string display_name = 2;
}

message GetNodeDescriptionEndpointRequest {
    string dataset_id = 1;

    // A decimal number as a string: ids outgrow 64-bit integers deep in the octree. The root is "0".
    string node_id = 2;
}

message GetNodeDescriptionEndpointResponse {
    // Absolute URL of the node's tileset JSON, e.g. "http://localhost:5007/tileset/node/0.json".
    string node_description_endpoint = 1;
}

message GetLivePointsRequest {
    string dataset_id = 1;    

    // IGNORED: points are coloured with the mode set through SetColorMode, shared by every frontend. Kept so a request
    // that sets it still works; it may be removed.
    ColorMode color_mode = 2;
}

// Positions are in the dataset's local frame: metres East (X), North (Y) and Up (Z) of geo_reference, the same frame
// the tilesets use. Each point set stores them as float32 offsets from origin, which keeps them small enough for
// float32 to be precise. In deck.gl: coordinateSystem METER_OFFSETS, coordinateOrigin = [longitude, latitude, height]
// of geo_reference, modelMatrix = a translation by origin; then the binary arrays can be used directly.
message GetLivePointsResponse {
    GeoReference geo_reference = 1;
    Vector3 origin = 2;
    // The most recently ingested points, coloured with the current colour mode (see SetColorMode).
    PointSet points = 3;
    // HH:mm:ss drawn in magenta points 30 m above the points; draw it in the same layer or its own.
    PointSet clock = 4;
}

message GeoReference {
    double latitude_degrees = 1;
    double longitude_degrees = 2;
    double height_meters = 3;
}

message Vector3 {
    double x = 1;
    double y = 2;
    double z = 3;
}

// Binary rather than repeated fields, so a browser can view the bytes as typed arrays instead of decoding hundreds of
// thousands of numbers one by one.
message PointSet {
    uint32 count = 1;
    // count x 3 little-endian float32: X, Y, Z of each point, relative to GetLivePointsResponse.origin.
    // As a Float32Array: new Float32Array(positions.slice().buffer).
    bytes positions = 2;
    // count x 3 uint8: R, G, B of each point. Usable directly as a Uint8Array.
    bytes colors = 3;
}

message GetColorModesRequest {
}

message GetColorModesResponse {
    // The point attributes that can be coloured by, as Surge's dataset declares them, e.g. "Z" (elevation) and
    // "Intensity".
    repeated string attributes = 1;
    repeated Palette palettes = 2;
    ColorMode current = 3;
}

// A gradient, from an attribute's lowest value (the first stop) to its highest (the last), stops evenly spaced.
message Palette {
    // Stable identifier, used in ColorMode.palette_id, e.g. "blue-green-yellow-red".
    string id = 1;
    // For display in a picker, e.g. "Blue - green - yellow - red".
    string name = 2;
    repeated Rgb stops = 3;
}

message Rgb {
    // 0-255 each.
    uint32 r = 1;
    uint32 g = 2;
    uint32 b = 3;
}

message ColorMode {
    // One of the names in GetColorModesResponse.attributes, e.g. "Z".
    string attribute_name = 1;
    // One of GetColorModesResponse.palettes' ids.
    string palette_id = 2;
}

message SetColorModeRequest {
    ColorMode color_mode = 1;
    string dataset_id
}

message SetColorModeResponse {
    // The mode now in effect.
    ColorMode color_mode = 1;
}
 