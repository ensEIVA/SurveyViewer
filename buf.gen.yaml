# `npm run generate` — regenerates src/gen from proto/. Generated code is
# committed, so a fresh clone builds without running buf first.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt: target=ts
    # The topics are read through the Fletcher gateway, not gRPC: their
    # schemas come from protoc-gen-fletcher (`npm run generate`).
    exclude_types:
      - nexus.topics.v1
